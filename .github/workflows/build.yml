name: build

# 云端构建，不在本地占 CPU。
# - push 到 master：只跑构建，产物在 Actions 的 Artifacts 里
# - 打 tag（v*）：构建完自动发 Release 附二进制
# - 也可以手动触发

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # ONNX Runtime 的静态库需要较新的 glibc（__isoc23_* 符号），22.04 链不上。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libgtk-3-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-linux
          path: |
            target/release/upmix-gui
            target/release/upmix-core
            target/release/upmix-tui

  windows:
    # 同上：宿主编译也走 24.04。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 安装 mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - uses: Swatinem/rust-cache@v2

      - name: 交叉构建
        run: cargo build --release --target x86_64-pc-windows-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-windows
          path: target/x86_64-pc-windows-gnu/release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: 打包
        run: |
          cd upmix-linux && tar czf ../upmix-core-linux-x86_64.tar.gz upmix-gui upmix-core upmix-tui && cd ..
          cd upmix-windows && zip -j ../upmix-core-windows-x86_64.zip *.exe && cd ..
          ls -la *.tar.gz *.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            upmix-core-linux-x86_64.tar.gz
            upmix-core-windows-x86_64.zip
