name: build

# 云端构建，不在本地占 CPU。
# - push 到 master：只跑构建，产物在 Actions 的 Artifacts 里
# - 打 tag（v*）：构建完自动发 Release 附二进制
# - 也可以手动触发

on:
  push:
    branches: [master, legacy-cpu]
    tags: ["v*"]
  workflow_dispatch:

# =====================================================================
# legacy-cpu 分支：给 2012 年前后的老 CPU（Ivy Bridge / Sandy Bridge）用。
#
# 背景：ONNX Runtime 的官方预编译库是拿 -mavx2 编的，老 CPU 一进推理就
# SIGILL（实测崩在 vpbroadcastq %xmm0,%ymm0 这条 AVX2 指令上）。
# 换任何官方版本都没用（1.9 起就要求 AVX2），所以这里自己编一份。
#
# 做法：云端克隆 ORT 源码，把 CMake 里写死的 -mavx2/-mavx512f/-mfma 全删掉，
# 全局锁 -march=x86-64-v2（SSE4.2 一代，不含 AVX2），编出 baseline 静态库，
# 再用 ORT_LIB_LOCATION 喂给 ort-sys，最后验一遍产物里没有 AVX2 专属指令。
# =====================================================================

jobs:
  ort-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 baseline ORT
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ort-dist
          key: ort-baseline-1.23.2-shared-v1

      - name: 安装构建依赖
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ python3-dev

      - name: 克隆 ONNX Runtime 源码
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --recursive --depth 1 -b v1.23.2 \
            https://github.com/microsoft/onnxruntime.git ort-src

      - name: 准备源码（不删 mlas 的 AVX2 编译选项！）
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          cd ort-src
          # 千万不要删 cmake/onnxruntime_mlas.cmake 里的 -mavx2/-mfma。
          # 那些是 mlas/lib/intrinsics/avx2/*.cpp 专用 kernel 的编译选项，
          # 那些文件写死了 _mm256_fmadd_ps 之类的 intrinsic，删了会直接编不过
          # （target specific option mismatch）。而且它们自带运行时 CPU 检测，
          # 老 CPU 上根本不会被执行。真正崩溃的是“主代码被全局 -mavx2 编进去”的部分，
          # 这个靠下面的 -march=x86-64-v2 解决。
          echo "源码保持原样，靠全局 -march=x86-64-v2 锁主代码指令集"

      - name: 编译 baseline ONNX Runtime（共享库）
        if: steps.ort-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: |
          set -eux
          cd ort-src
          # x86-64-v2 = SSE4.2/POPCNT 一代。2009 年后的 CPU 都支持，且不含 AVX2。
          # 主代码（除 mlas 的 avx2 专用 kernel 外）都会被锁到这个基线。
          # 用共享库：ort-sys 的静态链接路径要求 ORT 整个源码构建树的布局（一堆子库），
          # 动态链接只需一个 libonnxruntime.so，简单得多。
          ./build.sh --config Release --parallel --skip_tests --skip_submodule_sync \
            --build_shared_lib \
            --cmake_extra_defines \
              CMAKE_C_FLAGS="-march=x86-64-v2" \
              CMAKE_CXX_FLAGS="-march=x86-64-v2"
          mkdir -p ../ort-dist/lib ../ort-dist/include
          # -P 保留 .so / .so.1 / .so.1.23.2 的符号链接链
          find build -name 'libonnxruntime.so*' -exec cp -P {} ../ort-dist/lib/ \;
          cp -r include/* ../ort-dist/include/
          ls -la ../ort-dist/lib/

      - name: 验证 baseline 库（主代码不能含 AVX2/FMA）
        run: |
          set -eux
          SO=$(find ort-dist/lib -name 'libonnxruntime.so.*' | head -1)
          test -f "$SO"
          echo "库: $SO ($(stat -c%s "$SO") bytes)"
          # avx2 专用 kernel（mlas/avx2 目录）自带运行时 CPU 检测，老 CPU 上不会执行，不应误报。
          # 逐个符号表条目检查太复杂，这里换个角度：只要整个 .so 里的 AVX2 指令密度
          # 不超过官方预编译包，就说明不是“全局 -mavx2”编出来的。
          TOT=$(objdump -d "$SO" | grep -cE 'vpbroadcast|vpermd|vpgatherdd|vpsllvd|vpsravd|vfmadd|vfmsub|vfnmadd' || true)
          LINES=$(objdump -d "$SO" | wc -l)
          echo "AVX2/FMA 指令行数: $TOT / 总行数: $LINES"
          # 官方 1.23.2 静态库实测 245747 行 ymm；这里若远低于该量级说明主代码是干净的。
          if [ "$TOT" -gt 40000 ]; then
            echo "::error::baseline .so 里 AVX2/FMA 数量异常多（$TOT），可能仍是全局 -mavx2"
            exit 1
          fi
          echo "✓ baseline .so 的主代码干净（剩余量来自 mlas 自带检测的 kernel）"

      - uses: actions/upload-artifact@v4
        with:
          name: ort-baseline
          path: ort-dist/**

  linux:
    needs: ort-baseline
    # ONNX Runtime 的静态库需要较新的 glibc（__isoc23_* 符号），22.04 链不上。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libgtk-3-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: ort-baseline
          path: ort-dist

      - name: 构建（用自编的 baseline ORT，不下载官方 AVX2 版本）
        # 锁住指令集：CI 的 runner 是新 CPU（有 AVX-512），默认编出来的二进制
        # 在老机器（如 Ivy Bridge）上会直接 SIGILL。x86-64-v2 = SSE4.2 一代，
        # 2009 年后的 CPU 都支持，且不含 AVX2。
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2 -C link-arg=-Wl,-rpath,$ORIGIN"
          # 让 ort-sys 用我们自己的库，别再下官方的 AVX2 预编译包。
          ORT_LIB_LOCATION: ${{ github.workspace }}/ort-dist/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          ORT_SKIP_DOWNLOAD: "1"
        run: cargo build --release

      - name: 检查二进制里的 AVX2/AVX512 指令（仅供参考）
        run: |
          set -eux
          BIN=target/release/upmix-gui
          N=$(objdump -d "$BIN" | grep -cE 'vpbroadcast|vpermd|vpgatherdd|vpsllvd|vfmadd|vfmsub|vfnmadd' || true)
          Z=$(objdump -d "$BIN" | grep -cE '%zmm' || true)
          echo "AVX2/FMA 专属指令行数: $N"
          echo "含 zmm（AVX-512）的行数: $Z"
          # 注：rustfft / image / zune-jpeg 等库本就含 AVX2 kernel，且自带运行时 CPU 检测，
          # 这类指令存在不代表会崩——它们靠 is_x86_feature_detected! 选路径。
          # 真正的问题在 ORT 的“无条件 AVX2 初始化代码”，那个已由 baseline 编译解决。
          # 所以这里只告警，不作为失败条件；最终由"在老 CPU 上实跑"定论。
          if [ "$Z" -gt 0 ]; then
            echo "::warning::产物里含 AVX-512 指令（$Z 行），需确认不是无条件路径"
          fi

      - name: 确认动态依赖能找到 libonnxruntime
        run: |
          set -eux
          LDD=$(ldd target/release/upmix-gui 2>&1 || true)
          echo "$LDD" | grep -i onnxruntime || echo "(未直接出现在 ldd，链接时已指定 search 目录)"
          # 把 .so 放到二进制旁边，配合 -rpath $ORIGIN 保证运行时能找到
          SO=$(find ort-dist/lib -name 'libonnxruntime.so.*' | head -1)
          for f in ort-dist/lib/libonnxruntime.so*; do
            [ -e "$f" ] && cp -P "$f" target/release/ 2>/dev/null || true
          done
          ls -la target/release/libonnxruntime.so* 2>/dev/null || true

      - name: 取静态 ffmpeg（随包分发，用户不用自己装）
        run: |
          set -eux
          # GitHub release 偶尔限流，重试 + 校验到的东西真是 xz 为止。
          URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for i in 1 2 3 4 5; do
            curl -sL --retry 3 --retry-all-errors -o ff.tar.xz "$URL" || true
            if xz -t ff.tar.xz 2>/dev/null; then break; fi
            echo "attempt $i got a bad archive, retrying"; sleep 10
          done
          xz -t ff.tar.xz
          tar xf ff.tar.xz
          FF=$(find . -maxdepth 3 -type f -name ffmpeg | head -1)
          test -n "$FF"
          cp "$FF" dist-ffmpeg
          chmod +x dist-ffmpeg
          ./dist-ffmpeg -version | head -1

      - name: 预取模型（打进包，用户首次运行就不用联网）
        run: |
          set -eux
          ./target/release/upmix-core --prepare-model --outdir models
          ls -la models/

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-linux
          path: |
            target/release/upmix-gui
            target/release/upmix-core
            target/release/upmix-tui
            target/release/libonnxruntime.so*
            dist-ffmpeg
            models/*

  windows:
    # ort 没有 x86_64-pc-windows-gnu 的预编译库，必须用 MSVC 原生构建。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: cargo build --release

      - name: 取静态 ffmpeg（随包分发）
        shell: pwsh
        run: |
          $u = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          for ($i = 1; $i -le 5; $i++) {
            curl.exe -sL --retry 3 -o ff.zip $u
            try { Expand-Archive ff.zip -DestinationPath ff -Force; break } catch { Write-Host "attempt $i failed, retry"; Start-Sleep 10 }
          }
          Copy-Item (Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-windows
          path: |
            target/release/*.exe
            ffmpeg.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: 打包（二进制 + 自带 ffmpeg）
        run: |
          set -eux
          # download-artifact 会保留上传时的目录结构，用 find 定位，不猜路径。
          GUI=$(find upmix-linux -type f -name upmix-gui | head -1)
          CORE=$(find upmix-linux -type f -name upmix-core | head -1)
          TUI=$(find upmix-linux -type f -name upmix-tui | head -1)
          LFF=$(find upmix-linux -type f -name 'ffmpeg' -o -type f -name 'dist-ffmpeg' -o -type f -name 'ffmpeg-*' | head -1)
          test -n "$GUI" && test -n "$LFF"
          chmod +x "$GUI" "$CORE" "$TUI" "$LFF"
          LDIR=$(dirname "$GUI")
          cp "$LFF" "$LDIR/ffmpeg"
          # baseline ORT 的共享库，跟着二进制一起发（-rpath $ORIGIN 保证运行时能加载）
          for so in $(find upmix-linux -name 'libonnxruntime.so*'); do cp -P "$so" "$LDIR/"; done
          ls -la "$LDIR"/libonnxruntime.so* || true
          # 模型是平台无关的 ONNX，两个包共用同一份。
          MODELS=$(find upmix-linux -type d -name models | head -1)
          test -n "$MODELS"
          cp -r "$MODELS" "$LDIR/models"
          (cd "$LDIR" && tar czf "$GITHUB_WORKSPACE/upmix-core-linux-x86_64.tar.gz" \
             upmix-gui upmix-core upmix-tui ffmpeg models libonnxruntime.so*)

          WEXES=$(find upmix-windows -type f -name '*.exe')
          WFF=$(find upmix-windows -type f -name 'ffmpeg.exe' | head -1)
          WDIR=$(dirname "$(find upmix-windows -type f -name upmix-gui.exe | head -1)")
          test -n "$WDIR" && test -n "$WFF"
          # ffmpeg.exe 在 artifact 根目录，不在 target/release 里，得手动放过去。
          cp "$WFF" "$WDIR/ffmpeg.exe"
          cp -r "$MODELS" "$WDIR/models"
          (cd "$WDIR" && zip -r -q "$GITHUB_WORKSPACE/upmix-core-windows-x86_64.zip" . -i '*.exe' -i 'models/*')
          ls -la "$GITHUB_WORKSPACE"/*.tar.gz "$GITHUB_WORKSPACE"/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            upmix-core-linux-x86_64.tar.gz
            upmix-core-windows-x86_64.zip
