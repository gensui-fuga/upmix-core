name: build

# 云端构建，不在本地占 CPU。
# - push 到 master / legacy-cpu：只跑构建，产物在 Actions 的 Artifacts 里
# - 打 tag（v*）：构建完自动发 Release 附二进制
# - 也可以手动触发

on:
  push:
    branches: [master, legacy-cpu]
    tags: ["v*"]
  workflow_dispatch:

# =====================================================================
# legacy-cpu 分支：给 2012 年前后的老 CPU（Ivy Bridge / Sandy Bridge）用。
#
# 背景：ONNX Runtime 的官方预编译库是拿 -mavx2 编的，老 CPU 一进推理就
# SIGILL（实测崩在 vpbroadcastq %xmm0,%ymm0 这条 AVX2 指令上）。
# 换任何官方版本都没用（1.9 起就要求 AVX2），所以这里自己编一份。
#
# 做法：云端克隆 ORT 源码，把 CMake 里写死的 -mavx2/-mavx512f/-mfma 全删掉，
# 全局锁 -march=x86-64-v2（SSE4.2 一代，不含 AVX2），编出 baseline 静态库，
# 再用 ORT_LIB_LOCATION 喂给 ort-sys，最后验一遍产物里没有 AVX2 专属指令。
# =====================================================================

jobs:
  ort-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 baseline ORT
        uses: actions/cache@v4
        with:
          path: ort-dist
          key: ort-baseline-1.23.2-shared-v2
          # tag 的 run 看不到分支的缓存（GitHub 缓存按 ref 隔离），
          # restore-keys 让它退而求其次复用同前缀的缓存，避免发版时重编 ORT。
          restore-keys: |
            ort-baseline-1.23.2-shared-

      - name: 判断 baseline ORT 是否已经就绪
        id: ort-ready
        # 这里不能只看 `cache-hit`：`restore-keys` 前缀命中时 `cache-hit` 是 **false**
        # （只有 key 精确命中才是 true），可文件其实已经恢复出来了。原来的四步全写的
        # `if: steps.ort-cache.outputs.cache-hit != 'true'`，于是**每次打 tag 发版都会
        # 把 ONNX Runtime 从头重编一遍**（40~90 分钟）——v0.5.3-legacy 和 v1.0.0-legacy
        # 都是这么白烧的。改成直接看恢复出来的文件在不在。
        run: |
          set -eux
          if ls ort-dist/lib/libonnxruntime.so.* >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            ls -la ort-dist/lib/
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装构建依赖
        if: steps.ort-ready.outputs.ready != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ python3-dev

      - name: 克隆 ONNX Runtime 源码
        if: steps.ort-ready.outputs.ready != 'true'
        run: |
          set -eux
          git clone --recursive --depth 1 -b v1.23.2 \
            https://github.com/microsoft/onnxruntime.git ort-src

      - name: 准备源码（不删 mlas 的 AVX2 编译选项！）
        if: steps.ort-ready.outputs.ready != 'true'
        run: |
          set -eux
          cd ort-src
          # 千万不要删 cmake/onnxruntime_mlas.cmake 里的 -mavx2/-mfma。
          # 那些是 mlas/lib/intrinsics/avx2/*.cpp 专用 kernel 的编译选项，
          # 那些文件写死了 _mm256_fmadd_ps 之类的 intrinsic，删了会直接编不过
          # （target specific option mismatch）。而且它们自带运行时 CPU 检测，
          # 老 CPU 上根本不会被执行。真正崩溃的是“主代码被全局 -mavx2 编进去”的部分，
          # 这个靠下面的 -march=x86-64-v2 解决。
          echo "源码保持原样，靠全局 -march=x86-64-v2 锁主代码指令集"

      - name: 编译 baseline ONNX Runtime（共享库）
        if: steps.ort-ready.outputs.ready != 'true'
        timeout-minutes: 90
        run: |
          set -eux
          cd ort-src
          # x86-64-v2 = SSE4.2/POPCNT 一代。2009 年后的 CPU 都支持，且不含 AVX2。
          # 主代码（除 mlas 的 avx2 专用 kernel 外）都会被锁到这个基线。
          # 用共享库：ort-sys 的静态链接路径要求 ORT 整个源码构建树的布局（一堆子库），
          # 动态链接只需一个 libonnxruntime.so，简单得多。
          ./build.sh --config Release --parallel --skip_tests --skip_submodule_sync \
            --build_shared_lib \
            --cmake_extra_defines \
              CMAKE_C_FLAGS="-march=x86-64-v2" \
              CMAKE_CXX_FLAGS="-march=x86-64-v2"
          mkdir -p ../ort-dist/lib ../ort-dist/include
          # -P 保留 .so / .so.1 / .so.1.23.2 的符号链接链
          find build -name 'libonnxruntime.so*' -exec cp -P {} ../ort-dist/lib/ \;
          cp -r include/* ../ort-dist/include/
          ls -la ../ort-dist/lib/

      - name: 验证 baseline 库（主代码不能含 AVX2/FMA）
        run: |
          set -eux
          SO=$(find ort-dist/lib -name 'libonnxruntime.so.*' | head -1)
          test -f "$SO"
          echo "库: $SO ($(stat -c%s "$SO") bytes)"
          # avx2 专用 kernel（mlas/avx2 目录）自带运行时 CPU 检测，老 CPU 上不会执行，不应误报。
          # 逐个符号表条目检查太复杂，这里换个角度：只要整个 .so 里的 AVX2 指令密度
          # 不超过官方预编译包，就说明不是“全局 -mavx2”编出来的。
          TOT=$(objdump -d "$SO" | grep -cE 'vpbroadcast|vpermd|vpgatherdd|vpsllvd|vpsravd|vfmadd|vfmsub|vfnmadd' || true)
          LINES=$(objdump -d "$SO" | wc -l)
          echo "AVX2/FMA 指令行数: $TOT / 总行数: $LINES"
          # 官方 1.23.2 静态库实测 245747 行 ymm；这里若远低于该量级说明主代码是干净的。
          if [ "$TOT" -gt 40000 ]; then
            echo "::error::baseline .so 里 AVX2/FMA 数量异常多（$TOT），可能仍是全局 -mavx2"
            exit 1
          fi
          echo "✓ baseline .so 的主代码干净（剩余量来自 mlas 自带检测的 kernel）"

      - uses: actions/upload-artifact@v4
        with:
          name: ort-baseline
          path: ort-dist/**

  linux:
    needs: ort-baseline
    # ONNX Runtime 的静态库需要较新的 glibc（__isoc23_* 符号），22.04 链不上。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libgtk-3-dev pkg-config \
            flac
          # 装上 flac CLI：用户机器上只要装了 flac（Arch 上很常见），写 FLAC 就
          # 走它而不是内置编码器。之前 CI 里没有 flac，于是 write_cli 这条路径
          # 一次都没被执行过——它坏掉了 CI 也是绿的。内置编码器那条路由
          # flac.rs 里直接调 write_enc / 12-20bit 回退的用例覆盖，两条都不落下。
          flac --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: ort-baseline
          path: ort-dist

      - name: 构建（用自编的 baseline ORT，不下载官方 AVX2 版本）
        # 锁住指令集：CI 的 runner 是新 CPU（有 AVX-512），默认编出来的二进制
        # 在老机器（如 Ivy Bridge）上会直接 SIGILL。x86-64-v2 = SSE4.2 一代，
        # 2009 年后的 CPU 都支持，且不含 AVX2。
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2 -C link-arg=-Wl,-rpath,$ORIGIN"
          # 让 ort-sys 用我们自己的库，别再下官方的 AVX2 预编译包。
          ORT_LIB_LOCATION: ${{ github.workspace }}/ort-dist/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          ORT_SKIP_DOWNLOAD: "1"
        # --locked：仓库里的 Cargo.lock 必须和 Cargo.toml 一致，否则直接失败。
        # 以前不加，cargo 会在 CI 里悄悄重算一遍依赖，结果提交上去的锁文件
        # 长期是残缺的（缺 ort/stem-splitter 整棵树）也没人发现。
        run: cargo build --release --locked

      - name: 把 baseline libonnxruntime.so 摆到二进制旁边
        # 这个包是**动态**链接 ORT 的（-rpath $ORIGIN），二进制旁边必须有 .so 才
        # 跑得起来。必须排在所有「执行二进制」的步骤之前——单元测试的测试二进制
        # 同样链接了 ort，早于这一步跑会直接找不到库。
        run: |
          set -eux
          for f in ort-dist/lib/libonnxruntime.so*; do
            [ -e "$f" ] && cp -P "$f" target/release/ || true
          done
          ls -la target/release/libonnxruntime.so*
          ldd target/release/upmix-gui | grep -i onnxruntime || echo "(未直接出现在 ldd，链接时已指定 search 目录)"

      - name: 跑单元测试（元数据搬运/RIFF/ID3 这类纯逻辑，不需要模型）
        # 以前 CI 只 build 不 test，改坏了没人拦得住。这里补上。
        # 只测 upmix-core：GUI/TUI 的测试基本是 UI，且会拖长构建。
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2 -C link-arg=-Wl,-rpath,$ORIGIN"
          ORT_LIB_LOCATION: ${{ github.workspace }}/ort-dist/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          ORT_SKIP_DOWNLOAD: "1"
        run: cargo test --release --locked -p upmix-core

      - name: clippy（只报告不拦，用来找潜在 bug）
        # 人为 review 会漏，让编译器帮忙扫一遍。continue-on-error：样式类告警
        # 不该拦住发版，但正确性类的必须能在日志里看见。
        continue-on-error: true
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2 -C link-arg=-Wl,-rpath,$ORIGIN"
          ORT_LIB_LOCATION: ${{ github.workspace }}/ort-dist/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          ORT_SKIP_DOWNLOAD: "1"
        run: |
          cargo clippy --release --locked -p upmix-core --all-targets -- -W clippy::all 2>&1 | tail -300
          echo "=== 只看正确性/可疑类 ==="
          cargo clippy --release --locked -p upmix-core --all-targets -- -W clippy::all 2>&1 \
            | grep -E "^warning|^error" | sort | uniq -c | sort -rn | head -40

      - name: 检查二进制里的 AVX2/AVX512 指令（仅供参考）
        run: |
          set -eux
          BIN=target/release/upmix-gui
          N=$(objdump -d "$BIN" | grep -cE 'vpbroadcast|vpermd|vpgatherdd|vpsllvd|vfmadd|vfmsub|vfnmadd' || true)
          Z=$(objdump -d "$BIN" | grep -cE '%zmm' || true)
          echo "AVX2/FMA 专属指令行数: $N"
          echo "含 zmm（AVX-512）的行数: $Z"
          # 注：rustfft / image / zune-jpeg 等库本就含 AVX2 kernel，且自带运行时 CPU 检测，
          # 这类指令存在不代表会崩——它们靠 is_x86_feature_detected! 选路径。
          # 真正的问题在 ORT 的“无条件 AVX2 初始化代码”，那个已由 baseline 编译解决。
          # 所以这里只告警，不作为失败条件；最终由"在老 CPU 上实跑"定论。
          if [ "$Z" -gt 0 ]; then
            echo "::warning::产物里含 AVX-512 指令（$Z 行），需确认不是无条件路径"
          fi

      - name: 取静态 ffmpeg（随包分发，用户不用自己装）
        run: |
          set -eux
          # GitHub release 偶尔限流，重试 + 校验到的东西真是 xz 为止。
          URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for i in 1 2 3 4 5; do
            curl -sL --retry 3 --retry-all-errors -o ff.tar.xz "$URL" || true
            if xz -t ff.tar.xz 2>/dev/null; then break; fi
            echo "attempt $i got a bad archive, retrying"; sleep 10
          done
          xz -t ff.tar.xz
          tar xf ff.tar.xz
          FF=$(find . -maxdepth 3 -type f -name ffmpeg | head -1)
          test -n "$FF"
          cp "$FF" dist-ffmpeg
          chmod +x dist-ffmpeg
          ./dist-ffmpeg -version | head -1
          # ffprobe 不进发行包，只给端到端测试验输出用（声道数/采样率/标签/封面）。
          FFP=$(find . -maxdepth 3 -type f -name ffprobe | head -1)
          test -n "$FFP"
          cp "$FFP" dist-ffprobe
          chmod +x dist-ffprobe
          ./dist-ffprobe -version | head -1

      - name: 预取模型（打进包，用户首次运行就不用联网）
        run: |
          set -eux
          ./target/release/upmix-core --prepare-model --outdir models
          ls -la models/

      - name: 自动分离批量冒烟测试（验引擎只加载一次）
        # 朋友实测：Windows + 自动分离，单个文件能转、批量跑到第二个文件整窗消失。
        # 成因是每个文件都重建一遍 ORT 会话（见 core/src/builtin_sep.rs 的 load_engine）。
        # 这里跑 2 个文件的自动分离批量，数引擎实际加载了几次：
        # 修好后 = 1 次；把这个闸门去掉 = 2 次。模型和 ffmpeg 上一步都已就位。
        env:
          UPMIX_TRACE_ENGINE: "1"
        run: |
          set -eux
          mkdir -p smoke/in
          ./dist-ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=4" -ac 2 -ar 44100 smoke/in/a.wav
          ./dist-ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=330:duration=4" -ac 2 -ar 44100 smoke/in/b.wav
          ./target/release/upmix-core --batch smoke/in --mode auto --outdir smoke/out \
            > smoke/log.txt 2>&1 || { cat smoke/log.txt; exit 1; }
          cat smoke/log.txt
          N=$(grep -c '^upmix-engine-load$' smoke/log.txt || true)
          echo "引擎实际加载次数 = $N（期望 1）"
          test "$N" -eq 1
          test -f smoke/out/a_5.1.flac
          test -f smoke/out/b_5.1.flac

      - name: 把 ffmpeg 摆到二进制旁边（复刻发行包布局）
        # core 的 ffmpeg_path() 是「先找 current_exe 旁边的，找不到再回落 PATH」。
        # 发行包里 ffmpeg 就躺在二进制旁边；CI 里如果只在仓库根目录放一份，
        # 测的就不是用户实际拿到的那个布局——MP3 解码和 WAV 标签搬运都依赖
        # 这个查找结果，布局不对会测出一堆假失败。
        run: |
          set -eux
          cp dist-ffmpeg target/release/ffmpeg
          cp dist-ffprobe target/release/ffprobe
          chmod +x target/release/ffmpeg target/release/ffprobe
          test -x target/release/ffmpeg

      - name: 备好内置分离模型（auto 模式端到端要用）
        # 从源码编译出来的二进制旁边没有 models/，auto 模式的端到端会直接报
        # 「找不到 models/ 目录」。注意模型和 ffmpeg 一样是按「二进制旁边优先」
        # 找的（builtin_sep 里先看 current_exe().parent()，再回落 CWD），而
        # ci/e2e.sh 会 cd 到临时目录，所以必须放到 target/release/ 下 ——
        # 这也正好是发行包里的真实布局。
        run: |
          set -eux
          ./target/release/upmix-core --prepare-model --outdir target/release/models
          test -d target/release/models

      - name: 端到端功能测试（真二进制 + 真音频）
        # 单元测试只覆盖纯逻辑，而用户踩到的坑全在「真二进制 + 真文件」这条路上：
        # 封面歌手歌词丢失、低音没声音、批量闪退。见 ci/e2e.sh 的注释。
        env:
          BIN: target/release/upmix-core
          FFMPEG: ./dist-ffmpeg
          FFPROBE: ./dist-ffprobe
        run: |
          set -eux
          chmod +x ci/e2e.sh
          bash ci/e2e.sh

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-linux
          path: |
            target/release/upmix-gui
            target/release/upmix-core
            target/release/upmix-tui
            target/release/libonnxruntime.so*
            dist-ffmpeg
            models/*

  windows:
    # ort 没有 x86_64-pc-windows-gnu 的预编译库，必须用 MSVC 原生构建。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        # 和 linux 侧一样用 --locked：Windows 也得按锁文件里的版本编，
        # 否则同一个 tag 在两个平台上解析出的依赖可能不是同一套。
        run: cargo build --release --locked

      - name: 取静态 ffmpeg（随包分发）
        shell: pwsh
        run: |
          $u = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          for ($i = 1; $i -le 5; $i++) {
            curl.exe -sL --retry 3 -o ff.zip $u
            try { Expand-Archive ff.zip -DestinationPath ff -Force; break } catch { Write-Host "attempt $i failed, retry"; Start-Sleep 10 }
          }
          Copy-Item (Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-windows
          path: |
            target/release/*.exe
            ffmpeg.exe

  wine-auto-batch:
    # 朋友实测：Windows + 自动分离，单个文件能转、批量跑到第二个文件整窗消失。
    # 这里用 Wine 跑**真正的 Windows 产物**，把批量自动分离整条路走一遍，数引擎
    # 实际加载了几次：旧行为 = 每个文件一次，修好后 = 1 次。
    # 注意：Wine 不是 Windows。它能证明这条路在 Windows 二进制上跑得通、引擎只
    # 加载一次；不能替代朋友在真机上复测。
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upmix-windows
          path: win

      - uses: actions/download-artifact@v4
        with:
          name: upmix-linux
          path: lin

      - name: 装 Wine
        run: |
          set -eux
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          # 只装 wine64 会得到 /usr/lib/wine/wine64，没有 /usr/bin/wine；
          # 而缺了 wine32 的话 prefix 初始化会失败（syswow64\rundll32.exe 打不开）。
          sudo apt-get install -y --no-install-recommends xvfb wine
          sudo apt-get install -y --no-install-recommends wine32 || true
          wine --version
          # prefix 必须在 X 下建：裸跑 wineboot 会报
          # "Make sure that your X server is running and that $DISPLAY is set correctly"
          xvfb-run -a wineboot -u || true
          xvfb-run -a wine cmd /c echo wine-self-test-ok || true

      - name: 造 directml.dll 桩（只为让 Wine 能加载 exe）
        # objdump -p 实测：upmix-core.exe 的**静态**导入表里有
        #   directml.dll!DMLCreateDevice1（就这一个符号）
        #   d3d12.dll!D3D12CreateDevice / D3D12SerializeVersionedRootSignature
        #   dxgi.dll!CreateDXGIFactory2
        # 而且这个 PE 根本没有延迟导入段，所以 Windows 加载器在进程启动时就要
        # 解析它们。Wine 自带 d3d12/dxgi，但没有 DirectML.dll，于是 exe 连启动
        # 都做不到（实测退出码 53，无任何输出）。
        # 我们关掉了 directml feature（Cargo.toml 里 default-features = false），
        # 从来不激活 DirectML EP，所以这个桩不会被真正调用——它只是让加载器
        # 过这一关。**桩不进发行包，只在这个测试里用。**
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends mingw-w64
          cat > stub.c <<'EOF'
          #include <windows.h>
          HRESULT WINAPI DMLCreateDevice1(void *a, DWORD b, DWORD c, void *d, void *e) {
              (void)a; (void)b; (void)c; (void)d; (void)e;
              return (HRESULT)0x80004005L;
          }
          EOF
          x86_64-w64-mingw32-gcc -shared -O2 -o directml.dll stub.c
          objdump -p directml.dll > dml.txt
          grep -i DMLCreateDevice1 dml.txt || { echo "桩没导出 DMLCreateDevice1"; tail -40 dml.txt; exit 1; }

      - name: Wine 下跑自动分离批量（2 个文件）
        env:
          UPMIX_TRACE_ENGINE: "1"
          WINEDEBUG: "-all"
        run: |
          # 注意：GitHub Actions 用 `bash -e` 跑这段，`set -ux` 关不掉那个 -e。
          # 上一轮就是探针退出 53 直接把步骤带走了，后面的诊断一句没跑。
          # 所以探针阶段显式 `set +e`。
          set -ux
          WINE=$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)
          D="$PWD/t"
          mkdir -p "$D/in" "$D/out"
          # exe 全放同一层：models/ 和 ffmpeg.exe 必须挨着 exe
          # （见 core/src/lib.rs 的 ffmpeg_path 和 builtin_sep.rs 的 model_dir）
          find win -type f -name '*.exe' -exec cp {} "$D/" \;
          cp -r "$(find lin -type d -name models | head -1)" "$D/models"
          # exe 的静态导入表要 directml.dll，Wine 没有，放桩在 exe 同目录
          cp directml.dll "$D/"
          # 造两个 4 秒立体声 WAV：用 Linux 侧静态 ffmpeg，不受 Wine 影响
          LFF=$(find lin -type f -name dist-ffmpeg | head -1)
          chmod +x "$LFF"
          "$LFF" -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=4" -ac 2 -ar 44100 "$D/in/a.wav"
          "$LFF" -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=330:duration=4" -ac 2 -ar 44100 "$D/in/b.wav"
          cd "$D"

          set +e
          echo "=== exe 的 DLL 依赖（objdump 直接读 PE，不靠运行）==="
          objdump -p upmix-core.exe 2>/dev/null | grep -i "DLL Name" || true
          echo "=== 探针1：Wine 自身能不能跑 Windows 程序 ==="
          xvfb-run -a "$WINE" cmd /c echo wine-self-test-ok > p1.txt 2>&1
          echo "p1 exit=$?"
          tail -20 p1.txt
          echo "=== 探针2：upmix-core.exe 能不能起来（不静音 Wine 的报错）==="
          WINEDEBUG=err+all xvfb-run -a "$WINE" upmix-core.exe --help > p2.txt 2>&1
          P2=$?
          echo "p2 exit=$P2"
          tail -40 p2.txt
          echo "=== 正式跑批量 ==="
          xvfb-run -a "$WINE" upmix-core.exe --batch in --mode auto --outdir out > log.txt 2>&1
          R=$?
          echo "batch exit=$R"
          tail -60 log.txt
          N=$(grep -c '^upmix-engine-load$' log.txt || true)
          echo "Wine 下引擎实际加载次数 = $N（期望 1）"
          ls -la out 2>/dev/null || true
          test "$R" -eq 0
          test "$N" -eq 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # legacy-cpu 分支只发 Linux 包：Windows 的 baseline ORT 还没做，
    # 官方 Windows ORT 同样要 AVX2，发给老机器用户会直接 SIGILL，不发反而更干净。
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upmix-linux

      - name: 打包（二进制 + 自带 ffmpeg + baseline ORT）
        run: |
          set -eux
          GUI=$(find . -type f -name upmix-gui | head -1)
          CORE=$(find . -type f -name upmix-core | head -1)
          TUI=$(find . -type f -name upmix-tui | head -1)
          LFF=$(find . -type f -name 'ffmpeg' -o -type f -name 'dist-ffmpeg' -o -type f -name 'ffmpeg-*' | head -1)
          test -n "$GUI" && test -n "$LFF"
          chmod +x "$GUI" "$CORE" "$TUI" "$LFF"
          LDIR=$(dirname "$GUI")
          cp "$LFF" "$LDIR/ffmpeg"
          for so in $(find . -name 'libonnxruntime.so*' -not -path "$LDIR/*"); do cp -P "$so" "$LDIR/"; done
          ls -la "$LDIR"/libonnxruntime.so* || true
          MODELS=$(find . -type d -name models | head -1)
          test -n "$MODELS"
          cp -r "$MODELS" "$LDIR/models"
          (cd "$LDIR" && tar czf "$GITHUB_WORKSPACE/upmix-core-linux-x86_64-legacy.tar.gz" \
             upmix-gui upmix-core upmix-tui ffmpeg models libonnxruntime.so*)
          ls -la "$GITHUB_WORKSPACE"/*.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            upmix-core-linux-x86_64-legacy.tar.gz
          body: |
            ## 老 CPU 专用版（无 AVX2）

            适用于 2012 年前后的 CPU（Ivy Bridge / Sandy Bridge，如 i5-3320M、Celeron J1900）。

            **和主线版的区别**：ONNX Runtime 是在 CI 里用 `-march=x86-64-v2` 重新编译的，
            不含官方预编译包里的 AVX2/AVX-512 指令，所以在老 CPU 上不会 SIGILL。

            **代价**：自动（分离）模式会明显变慢（双核 + 无 FMA 的硬伤）。
            快速模式不受影响。

            **包含**：upmix-gui / upmix-core / upmix-tui + 静态 ffmpeg + htdemucs 模型 + baseline libonnxruntime.so

            解压后直接跑：`./upmix-gui`（libonnxruntime.so 就在旁边，rpath 已指向 $ORIGIN）
