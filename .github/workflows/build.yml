name: build

# 云端构建，不在本地占 CPU。
# - push 到 master：只跑构建，产物在 Actions 的 Artifacts 里
# - 打 tag（v*）：构建完自动发 Release 附二进制
# - 也可以手动触发

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # ONNX Runtime 的静态库需要较新的 glibc（__isoc23_* 符号），22.04 链不上。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libgtk-3-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        run: cargo build --release

      - name: 取静态 ffmpeg（随包分发，用户不用自己装）
        run: |
          curl -sL --retry 3 -o ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg.tar.xz
          cp ffmpeg-*-static/ffmpeg dist-ffmpeg
          strip dist-ffmpeg || true
          ./dist-ffmpeg -version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-linux
          path: |
            target/release/upmix-gui
            target/release/upmix-core
            target/release/upmix-tui
            dist-ffmpeg

  windows:
    # ort 没有 x86_64-pc-windows-gnu 的预编译库，必须用 MSVC 原生构建。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        run: cargo build --release

      - name: 取静态 ffmpeg（随包分发）
        shell: pwsh
        run: |
          $u = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          curl.exe -sL --retry 3 -o ff.zip $u
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-windows
          path: |
            target/release/*.exe
            ffmpeg.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: 打包（二进制 + 自带 ffmpeg）
        run: |
          chmod +x upmix-linux/dist-ffmpeg
          mv upmix-linux/dist-ffmpeg upmix-linux/ffmpeg
          chmod +x upmix-linux/upmix-gui upmix-linux/upmix-core upmix-linux/upmix-tui
          (cd upmix-linux && tar czf ../upmix-core-linux-x86_64.tar.gz upmix-gui upmix-core upmix-tui ffmpeg)
          (cd upmix-windows && zip -j ../upmix-core-windows-x86_64.zip *.exe)
          ls -la *.tar.gz *.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            upmix-core-linux-x86_64.tar.gz
            upmix-core-windows-x86_64.zip
