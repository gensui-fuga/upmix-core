name: build

# 云端构建，不在本地占 CPU。
# - push 到 master：只跑构建，产物在 Actions 的 Artifacts 里
# - 打 tag（v*）：构建完自动发 Release 附二进制
# - 也可以手动触发

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # ONNX Runtime 的静态库需要较新的 glibc（__isoc23_* 符号），22.04 链不上。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libgtk-3-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        # 锁住指令集：CI 的 runner 是新 CPU（有 AVX-512），默认编出来的二进制
        # 在老机器（如 Ivy Bridge）上会直接 SIGILL。x86-64-v2 = SSE4.2 一代，
        # 2009 年后的 CPU 都支持，且不含 AVX2。
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: cargo build --release

      - name: 跑单元测试（元数据搬运/RIFF/ID3 这类纯逻辑，不需要模型）
        # 以前 CI 只 build 不 test，改坏了没人拦得住。这里补上。
        # 只测 upmix-core：GUI/TUI 的测试基本是 UI，且会拖长构建。
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: cargo test --release -p upmix-core

      - name: 取静态 ffmpeg（随包分发，用户不用自己装）
        run: |
          set -eux
          # GitHub release 偶尔限流，重试 + 校验到的东西真是 xz 为止。
          URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for i in 1 2 3 4 5; do
            curl -sL --retry 3 --retry-all-errors -o ff.tar.xz "$URL" || true
            if xz -t ff.tar.xz 2>/dev/null; then break; fi
            echo "attempt $i got a bad archive, retrying"; sleep 10
          done
          xz -t ff.tar.xz
          tar xf ff.tar.xz
          FF=$(find . -maxdepth 3 -type f -name ffmpeg | head -1)
          test -n "$FF"
          cp "$FF" dist-ffmpeg
          chmod +x dist-ffmpeg
          ./dist-ffmpeg -version | head -1

      - name: 预取模型（打进包，用户首次运行就不用联网）
        run: |
          set -eux
          ./target/release/upmix-core --prepare-model --outdir models
          ls -la models/

      - name: 自动分离批量冒烟测试（验引擎只加载一次）
        # 朋友实测：Windows + 自动分离，单个文件能转、批量跑到第二个文件整窗消失。
        # 成因是每个文件都重建一遍 ORT 会话（见 core/src/builtin_sep.rs 的 load_engine）。
        # 这里跑 2 个文件的自动分离批量，数引擎实际加载了几次：
        # 修好后 = 1 次；把这个闸门去掉 = 2 次。模型和 ffmpeg 上一步都已就位。
        env:
          UPMIX_TRACE_ENGINE: "1"
        run: |
          set -eux
          mkdir -p smoke/in
          ./dist-ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=4" -ac 2 -ar 44100 smoke/in/a.wav
          ./dist-ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=330:duration=4" -ac 2 -ar 44100 smoke/in/b.wav
          ./target/release/upmix-core --batch smoke/in --mode auto --outdir smoke/out \
            > smoke/log.txt 2>&1 || { cat smoke/log.txt; exit 1; }
          cat smoke/log.txt
          N=$(grep -c '^upmix-engine-load$' smoke/log.txt || true)
          echo "引擎实际加载次数 = $N（期望 1）"
          test "$N" -eq 1
          test -f smoke/out/a_5.1.flac
          test -f smoke/out/b_5.1.flac

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-linux
          path: |
            target/release/upmix-gui
            target/release/upmix-core
            target/release/upmix-tui
            dist-ffmpeg
            models/*

  windows:
    # ort 没有 x86_64-pc-windows-gnu 的预编译库，必须用 MSVC 原生构建。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: cargo build --release

      - name: 取静态 ffmpeg（随包分发）
        shell: pwsh
        run: |
          $u = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          for ($i = 1; $i -le 5; $i++) {
            curl.exe -sL --retry 3 -o ff.zip $u
            try { Expand-Archive ff.zip -DestinationPath ff -Force; break } catch { Write-Host "attempt $i failed, retry"; Start-Sleep 10 }
          }
          Copy-Item (Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1

      - uses: actions/upload-artifact@v4
        with:
          name: upmix-windows
          path: |
            target/release/*.exe
            ffmpeg.exe

  wine-auto-batch:
    # 朋友实测：Windows + 自动分离，单个文件能转、批量跑到第二个文件整窗消失。
    # 这里用 Wine 跑**真正的 Windows 产物**，把批量自动分离整条路走一遍，数引擎
    # 实际加载了几次：旧行为 = 每个文件一次，修好后 = 1 次。
    # 注意：Wine 不是 Windows。它能证明这条路在 Windows 二进制上跑得通、引擎只
    # 加载一次；不能替代朋友在真机上复测。
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upmix-windows
          path: win

      - uses: actions/download-artifact@v4
        with:
          name: upmix-linux
          path: lin

      - name: 装 Wine
        run: |
          set -eux
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          # 只装 wine64 会得到 /usr/lib/wine/wine64，没有 /usr/bin/wine；
          # /usr/bin/wine 是 `wine` 这个包提供的（它才是入口）。
          sudo apt-get install -y --no-install-recommends xvfb wine
          wine --version

      - name: Wine 下跑自动分离批量（2 个文件）
        env:
          UPMIX_TRACE_ENGINE: "1"
          WINEDEBUG: "-all"
        run: |
          set -eux
          WINE=$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)
          test -x "$WINE" || { echo "找不到 wine 可执行文件"; ls -la /usr/bin/wine* /usr/lib/wine/ || true; exit 1; }
          "$WINE" --version
          D="$PWD/t"
          mkdir -p "$D/in" "$D/out"
          # exe 全放同一层：models/ 和 ffmpeg.exe 必须挨着 exe
          # （见 core/src/lib.rs 的 ffmpeg_path 和 builtin_sep.rs 的 model_dir）
          find win -type f -name '*.exe' -exec cp {} "$D/" \;
          cp -r "$(find lin -type d -name models | head -1)" "$D/models"
          ls -la "$D" "$D/models"
          # 造两个 4 秒立体声 WAV：用 Linux 侧静态 ffmpeg，不受 Wine 影响
          LFF=$(find lin -type f -name dist-ffmpeg | head -1)
          chmod +x "$LFF"
          "$LFF" -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=4" -ac 2 -ar 44100 "$D/in/a.wav"
          "$LFF" -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=330:duration=4" -ac 2 -ar 44100 "$D/in/b.wav"
          cd "$D"
          xvfb-run -a "$WINE" upmix-core.exe --batch in --mode auto --outdir out \
            > log.txt 2>&1 || { cat log.txt; exit 1; }
          cat log.txt
          N=$(grep -c '^upmix-engine-load$' log.txt || true)
          echo "Wine 下引擎实际加载次数 = $N（期望 1）"
          test "$N" -eq 1
          ls -la out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, wine-auto-batch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: 打包（二进制 + 自带 ffmpeg）
        run: |
          set -eux
          # download-artifact 会保留上传时的目录结构，用 find 定位，不猜路径。
          GUI=$(find upmix-linux -type f -name upmix-gui | head -1)
          CORE=$(find upmix-linux -type f -name upmix-core | head -1)
          TUI=$(find upmix-linux -type f -name upmix-tui | head -1)
          LFF=$(find upmix-linux -type f -name 'ffmpeg' -o -type f -name 'dist-ffmpeg' -o -type f -name 'ffmpeg-*' | head -1)
          test -n "$GUI" && test -n "$LFF"
          chmod +x "$GUI" "$CORE" "$TUI" "$LFF"
          LDIR=$(dirname "$GUI")
          cp "$LFF" "$LDIR/ffmpeg"
          # 模型是平台无关的 ONNX，两个包共用同一份。
          MODELS=$(find upmix-linux -type d -name models | head -1)
          test -n "$MODELS"
          cp -r "$MODELS" "$LDIR/models"
          (cd "$LDIR" && tar czf "$GITHUB_WORKSPACE/upmix-core-linux-x86_64.tar.gz" \
             upmix-gui upmix-core upmix-tui ffmpeg models)

          WEXES=$(find upmix-windows -type f -name '*.exe')
          WFF=$(find upmix-windows -type f -name 'ffmpeg.exe' | head -1)
          WDIR=$(dirname "$(find upmix-windows -type f -name upmix-gui.exe | head -1)")
          test -n "$WDIR" && test -n "$WFF"
          # ffmpeg.exe 在 artifact 根目录，不在 target/release 里，得手动放过去。
          cp "$WFF" "$WDIR/ffmpeg.exe"
          cp -r "$MODELS" "$WDIR/models"
          (cd "$WDIR" && zip -r -q "$GITHUB_WORKSPACE/upmix-core-windows-x86_64.zip" . -i '*.exe' -i 'models/*')
          ls -la "$GITHUB_WORKSPACE"/*.tar.gz "$GITHUB_WORKSPACE"/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            upmix-core-linux-x86_64.tar.gz
            upmix-core-windows-x86_64.zip
