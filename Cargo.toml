[workspace]
resolver = "2"
members = ["core", "cli", "gui", "tui"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
upmix-core = { path = "core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rustfft = "6.4.1"
claxon = "0.4.3"
hound = "3.5.1"
flacenc = "0.5.1"
# 纯 Rust + ONNX Runtime 的源分离，替掉外挂的 Python demucs。
# default-features 默认带 cuda/coreml/directml/onednn/xnnpack，编译重且要额外的运行库，
# 这里只要 CPU 推理，保证“解压即用”。
stem-splitter-core = { version = "1.2", default-features = false }

# Local patch of flacenc 0.5.1: the upstream crate can emit multi-GB frames on
# 24-bit signal->silence transitions (flacenc-rs issue #256). The pure-Rust
# encoder is only a fallback; the CLI/Android paths prefer the system `flac`.
[patch.crates-io]
flacenc = { path = "vendor/flacenc" }

[profile.release]
opt-level = 3
# 之前是 lto = true + codegen-units = 1，等于关掉并行代码生成再做全量 LTO，
# 编译慢到发疯。thin LTO + 多 codegen unit 能开满所有核心，产物差别很小。
lto = "thin"
codegen-units = 16
strip = true
